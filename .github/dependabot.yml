version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    versioning-strategy: lockfile-only
    # The dependency ceilings have no watcher yet; #74 finding 5 owns it.
    # The e2e pins need a probe run CI does not make; #110 owns their freshness.
    ignore:
      - dependency-name: playwright
      - dependency-name: uvicorn
