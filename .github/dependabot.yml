version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    # One quality release moves every quality workflow pin together; the pin test needs them equal.
    groups:
      quality-workflows:
        patterns:
          - "overnightworks/quality*"
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: daily
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    versioning-strategy: lockfile-only
    # Ceilings are watched by .github/workflows/dependency-ceilings.yml, not by this entry.
    # The e2e pins need a probe run CI does not make; docs/runbooks/refresh-the-e2e-pins.md owns their freshness.
    ignore:
      - dependency-name: playwright
      - dependency-name: uvicorn
