name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Static checks
        run: scripts/run_static_checks.sh

      - name: Tests
        run: uv run --locked pytest tests -q --cov=webauth --cov-report=xml --cov-report=term-missing:skip-covered

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

      - name: Build the distribution
        run: uv build --build-constraint .github/requirements-build.txt --require-hashes

  # The name is a contract with release.yml: its REQUIRED_JOBS refuses a tag without this job green.
  lowest-direct:
    name: lowest-direct
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          enable-cache: true
          cache-suffix: lowest-direct

      - name: Create the environment
        run: uv venv --python 3.12

      - name: Install the lowest declared versions
        run: uv pip install --resolution lowest-direct -e ".[redis]" --group dev

      - name: Tests
        run: .venv/bin/pytest tests -q

  quality:
    name: quality
    needs: [checks, lowest-direct]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@0512e98cff3190c9bec855e6bc753180ab3aae02 # v0.9.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
