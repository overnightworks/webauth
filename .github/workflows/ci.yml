name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run --locked ruff check src tests e2e

      - name: Import boundaries
        run: uv run --locked lint-imports

      - name: Pyright
        run: uv run --locked --extra dev --group e2e pyright --stats

      - name: An OIDC-only host type-checks against the built wheel
        run: tests/typing/check_against_wheel.sh

      - name: Tests
        run: uv run --locked pytest tests -q --cov=webauth --cov-report=xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

      - name: Build the distribution
        run: uv build --build-constraint .github/requirements-build.txt --require-hashes

  # The name is a contract with release.yml: its REQUIRED_JOBS refuses a tag without this job green.
  lowest-direct:
    name: lowest-direct
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
          cache-suffix: lowest-direct

      - name: Create the environment
        run: uv venv --python 3.12

      - name: Install the lowest declared versions
        run: uv pip install --resolution lowest-direct -e ".[dev,redis,jwt]"

      - name: Tests
        run: .venv/bin/pytest tests -q

  quality:
    name: quality
    needs: [checks]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@75467b7888ab8158dda370c770d3323dfc1f594e # v0.1.1
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.WEBAUTH_PROBE_UNSET }}
