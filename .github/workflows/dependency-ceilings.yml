name: Dependency ceilings

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newest-release-within-ceiling:
    name: newest release within ceiling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Fail when a runtime dependency's newest release lies above its declared range
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import json
          import subprocess
          import sys
          import tomllib
          import urllib.request

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import InvalidVersion, Version

          pyproject = tomllib.load(open("pyproject.toml", "rb"))
          project = pyproject["project"]
          optional = sum(project["optional-dependencies"].values(), [])
          declared = [Requirement(text) for text in [*project["dependencies"], *optional]]
          git_sources = {
              canonicalize_name(name): source["git"]
              for name, source in pyproject["tool"]["uv"]["sources"].items()
              if "git" in source
          }


          def stable_versions(texts) -> list[Version]:
              versions = []
              for text in texts:
                  try:
                      version = Version(text.removeprefix("v"))
                  except InvalidVersion:
                      continue
                  if not version.is_prerelease:
                      versions.append(version)
              return versions


          def pypi_address(name: str) -> str:
              return f"https://pypi.org/pypi/{name}/json"


          def newest_pypi_release(name: str) -> Version:
              with urllib.request.urlopen(pypi_address(name), timeout=30) as reply:
                  releases = json.load(reply)["releases"]
              return max(
                  stable_versions(
                      version
                      for version, files in releases.items()
                      if files and not any(file["yanked"] for file in files)
                  )
              )


          def newest_git_release(repository: str) -> Version:
              listing = subprocess.run(
                  ["git", "ls-remote", "--tags", repository],
                  capture_output=True, text=True, check=True, timeout=60,
              ).stdout
              tags = (line.split("refs/tags/", 1)[1].removesuffix("^{}") for line in listing.splitlines())
              return max(stable_versions(tags))


          above_ceiling = []
          unreadable = []
          for requirement in declared:
              repository = git_sources.get(canonicalize_name(requirement.name))
              address = repository or pypi_address(requirement.name)
              try:
                  newest = newest_git_release(repository) if repository else newest_pypi_release(requirement.name)
              except Exception as error:
                  unreadable.append(f"{requirement.name}: cannot read {address}: {error!r}")
                  continue
              print(f"{requirement.name}: newest {newest}, declared {requirement.specifier}")
              if newest not in requirement.specifier:
                  above_ceiling.append(f"{requirement.name} {newest} is outside {requirement.specifier}")

          if unreadable or above_ceiling:
              sys.exit("\n".join([*unreadable, *above_ceiling]))
          PY
