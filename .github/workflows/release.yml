name: Release

# The tag is immutable, so quality's gate reads and refuses before any tag exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, X.Y.Z
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Gate
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: overnightworks/quality/.github/workflows/release-gate.yml@9ced0f5cee689f2c70fb1467513b943484bd65a5 # v0.11.1
    with:
      version: ${{ inputs.version }}

  build:
    name: Build
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ needs.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Refuse unless the checkout is the commit the gate judged
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$COMMIT" ]; then
            echo "Refused: the checkout is $head, not the gated commit $COMMIT." >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false

      - name: Build the distribution
        run: uv build --build-constraint .github/requirements-build.txt --require-hashes

      - name: Refuse unless the build holds exactly the wheel at the version
        run: |
          expected="overnightworks_webauth-${VERSION}-py3-none-any.whl"
          built=""
          if [ -d dist ]; then
            built=$(find dist -maxdepth 1 -name '*.whl' -printf '%f\n' | sort | paste -sd, -)
          fi
          if [ "$built" != "$expected" ]; then
            echo "Refused: the build must hold exactly $expected, but it holds ${built:-no wheel}." >&2
            exit 1
          fi

  tag:
    name: Tag
    needs: [gate, build]
    permissions:
      contents: write
    uses: overnightworks/quality/.github/workflows/release-tag.yml@9ced0f5cee689f2c70fb1467513b943484bd65a5 # v0.11.1
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
