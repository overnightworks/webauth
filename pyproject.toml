[project]
name = "overnightworks-webauth"
dynamic = ["version"]
description = "OpenID Connect login for FastAPI applications, with sessions, CSRF and rate limits"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["fastapi", "authentication", "session", "csrf", "cookies", "rate-limit", "oidc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Typing :: Typed",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.123.7,<1",
    "starlette>=0.46,<2",
    "anyio>=4.0,<5",
    "pydantic>=2.6,<3",
    "cryptography>=50.0.2,<51",
    "pyjwt[crypto]>=2.15.1,<3",
    "urllib3>=2.6.3,<3",
]

[project.optional-dependencies]
redis = ["redis>=5.0,<9"]

[dependency-groups]
dev = [
    "pytest>=7,<10",
    "pytest-cov>=7,<8",
    "fakeredis[lua]>=2.20,<3",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
    "import-linter>=2,<3",
    "pyright>=1.1.414,<2",
    "deptry==0.25.1",
]
e2e = [
    "playwright==1.62.0",
    "uvicorn[standard]==0.41.0",
]

[project.urls]
Repository = "https://github.com/overnightworks/webauth"
Issues = "https://github.com/overnightworks/webauth/issues"
Changelog = "https://github.com/overnightworks/webauth/blob/main/docs/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "webauth.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["webauth*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]

[tool.ruff.lint.flake8-bugbear]
# fastapi.Depends returns a frozen dataclass (fastapi/params.py at the locked 0.141.1); the
# Annotated[..., Depends()] form cannot resolve the closure-local callables in dependencies.py
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting is how a test asserts
"tests/**" = ["S101"]
# prove.py's checks are assertions, and its main refuses to run with assertions stripped
"e2e/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.deptry.per_rule_ignores]
# rate_limit imports redis only under TYPE_CHECKING, which deptry does not count as use
DEP002 = ["redis"]

[tool.pyright]
include = [
    "src/webauth",
    "e2e",
    "tests",
]
pythonVersion = "3.12"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/webauth/__init__.py" }]
