[project]
name = "overnightworks-webauth"
version = "0.1.0"
description = "Web authentication for FastAPI applications: sessions, cookies, CSRF, rate limits, audit ports"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.100,<1",
    "pydantic>=2,<3",
    "bcrypt>=4.0,<6",
]

[project.optional-dependencies]
redis = ["redis>=5.0,<9"]
dev = [
    "pytest>=7,<10",
    "fakeredis[lua]>=2,<3",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
    "import-linter>=2,<3",
]

[project.urls]
Repository = "https://github.com/overnightworks/webauth"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["webauth*"]

[tool.setuptools.package-data]
webauth = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
