[project]
name = "overnightworks-webauth"
version = "0.13.0"
description = "Web authentication for FastAPI applications: sessions, cookies, CSRF, rate limits, audit ports"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.100,<1",
    "pydantic>=2,<3",
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
redis = ["redis>=5.0,<9"]
jwt = [
    "cryptography>=50.0.2",
    "pyjwt[crypto]>=2.15.1,<3",
    # https_client overrides HTTPSConnection._new_conn and reads self._dns_host, both private.
    "urllib3>=2.6.3,<3",
]
dev = [
    "overnightworks-webauth[jwt]",
    "pytest>=7,<10",
    "pytest-cov>=7,<8",
    "fakeredis[lua]>=2,<3",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
    "import-linter>=2,<3",
]

[dependency-groups]
e2e = [
    "playwright==1.62.0",
    "uvicorn[standard]==0.41.0",
]

[project.urls]
Repository = "https://github.com/overnightworks/webauth"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["webauth*"]

[tool.setuptools.package-data]
webauth = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
